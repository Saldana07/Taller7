# java-api-demo-deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: java-api-demo-service
  namespace: demo-app
spec:
  selector:
    app: java-api-demo
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api-demo-deployment
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api-demo
  template:
    metadata:
      labels:
        app: java-api-demo
    spec:
      containers:
        - name: java-api-demo
          image: sebastiansaldana/java-api-demo:latest # <- reemplaza por tu usuario de Docker Hub
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.demo-app.svc.cluster.local:2392/demo"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: TEAM_NAME
              value: "Equipo ValenciaSaldaña"           # <- nombre de su equipo
          readinessProbe:
            httpGet:
              path: /api/demo/actuator/health/readiness
              port: 8085
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/demo/actuator/health/liveness
              port: 8085
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
