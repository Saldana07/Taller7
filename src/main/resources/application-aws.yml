# Perfil aws: base de datos en la nube (por ejemplo Amazon RDS).
# Los valores se pasan por variables de entorno; no se usa en este taller.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:mi-bd.xxxxxx.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:demo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    url: jdbc:postgresql://${DB_HOST:mi-bd.xxxxxx.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:demo}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
server:
  port: 8085
